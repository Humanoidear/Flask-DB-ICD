services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: datanotes-app:latest
    container_name: datanotes-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in backend/.env}
    ports:
      - "80:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
