services:
  db:
    image: postgres:16-alpine
    container_name: datanotes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datanotes}
      POSTGRES_USER: ${POSTGRES_USER:-datanotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-datanotes} -d ${POSTGRES_DB:-datanotes}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
