<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servidor web — DMZ</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 24px; }
    .card { width: 100%; max-width: 560px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; }
    .badge { display: inline-block; background: #dc2626; color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; }
    h1 { font-size: 28px; margin: 20px 0 24px; }
    dl { display: grid; gap: 18px; margin: 0; }
    dt { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; margin-bottom: 4px; }
    dd { margin: 0; font-size: 16px; color: #f1f5f9; }
    #ip { font-family: ui-monospace, Menlo, monospace; color: #38bdf8; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Zona desmilitarizada</span>
    <h1>Servidor web básico</h1>
    <dl>
      <dt>Asignatura</dt>
      <dd>Infraestructura Informática para Centros de Procesamiento de Datos (14541)</dd>
      <dt>Estudiante</dt>
      <dd>Alejandro González y Francisco Nortes</dd>
      <dt>Dirección IP</dt>
      <dd id="ip"></dd>
    </dl>
  </main>
  <script>document.getElementById("ip").textContent = location.hostname</script>
</body>
</html>
